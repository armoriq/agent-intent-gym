[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-intent-bench"
version = "0.1.0"
description = "Reusable environments and evaluation tools for agent intent and authorization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ArmorIQ" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3", "PyYAML>=6,<7", "httpx>=0.28,<1",
  "jsonschema>=4.23,<5", "typer>=0.16,<1", "rich>=14,<15",
  "textual>=6,<8", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
armoriq = [
    "armoriq-sdk>=0.8.17,<0.9",
]

[project.scripts]
intentbench = "agent_intent_bench.cli:app"

[project.urls]
Repository = "https://github.com/armoriq0/agent-intent-gym"
Issues = "https://github.com/armoriq0/agent-intent-gym/issues"
Documentation = "https://github.com/armoriq0/agent-intent-gym/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_intent_bench"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/examples", "/scripts", "/tests", "/docs", "/.github",
  "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml", "/uv.lock", "/.env.example", "/.python-version",
  "/.gitattributes", "/.gitignore",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.log"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
