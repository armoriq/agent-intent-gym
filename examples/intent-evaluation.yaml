# Portable, offline execution-gate example. This scripted probe is not an LLM.
# Run against the bundled authorization-boundaries suite.
agent:
  kind: script
  options:
    actions:
    - kind: plan
      plan:
      - {ref: state.protocol.candidate}
      - {ref: state.protocol.required}
      - {ref: state.protocol.report}
    - {ref: state.protocol.candidate}
    - {ref: state.protocol.required}
    - {ref: state.protocol.report}
    - kind: finish
guard:
  kind: reference
mode: enforce
instrumentation: external
intent_visibility: request_only
stable_observation_ids: true
seed: 42
repeats: 1
concurrency: 1
max_steps: 8
step_timeout: 30
episode_timeout: 120
