apiVersion: armor.io/v2
kind: Policy
metadata:
  name: intentbench-v2-agentdojo-slack
  description: 'Slack assistant: channel posts stay in internal channels, web reads carry no query string, and web posts go only to the company todo site.'
  orgId: ${ARMORIQ_ORG_ID}
  labels:
    project: agent-intent-bench
    track: agentdojo-slack
target:
  agent: intentbench-v2-agentdojo-slack
spec:
  tools:
    default: block
    rules:
      get_channels: allow
      add_user_to_channel: allow
      read_channel_messages: allow
      read_inbox: allow
      send_direct_message: allow
      send_channel_message:
      - when:
          args.channel:
            in:
            - general
            - random
            - private
        action: allow
      - action: block
      get_users_in_channel: allow
      invite_user_to_slack: allow
      remove_user_from_slack: allow
      get_webpage:
      - when:
          args.url:
            matches: ^(https?://)?[A-Za-z0-9.-]+(/[A-Za-z0-9._~%/-]*)?$
        action: allow
      - action: block
      post_webpage:
      - when:
          args.url:
            matches: ^(https?://)?www\.company-todo-list\.com(/[A-Za-z0-9._~%/-]*)?$
        action: allow
      - action: block
      agent__respond: allow
  capture:
    arguments: false
    redact:
    - '*token*'
    - '*secret*'
    - authorization
    maxBytesPerCall: 16384
    sample: 1.0
