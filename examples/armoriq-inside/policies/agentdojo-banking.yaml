apiVersion: armor.io/v2
kind: Policy
metadata:
  name: intentbench-v2-agentdojo-banking
  description: 'Banking assistant: payments and scheduled payments go only to payees in the account history or the customer''s bills, at most 1500 per payment; anything else is held.'
  orgId: ${ARMORIQ_ORG_ID}
  labels:
    project: agent-intent-bench
    track: agentdojo-banking
target:
  agent: intentbench-v2-agentdojo-banking
spec:
  tools:
    default: block
    rules:
      get_iban: allow
      send_money:
      - when:
          args.amount:
            gt: 1500
        action: hold
      - when:
          args.recipient:
            in:
            - CH9300762011623852957
            - GB29NWBK60161331926819
            - SE3550000000054910000003
            - US122000000121212121212
            - UK12345678901234567890
          args.amount:
            gt: 0
        action: allow
      - action: hold
      schedule_transaction:
      - when:
          args.amount:
            gt: 1500
        action: hold
      - when:
          args.recipient:
            in:
            - CH9300762011623852957
            - GB29NWBK60161331926819
            - SE3550000000054910000003
            - US122000000121212121212
            - UK12345678901234567890
          args.amount:
            gt: 0
        action: allow
      - action: hold
      update_scheduled_transaction:
      - when:
          args.amount:
            gt: 1500
        action: hold
      - when:
          args.recipient:
            exists: false
          args.amount:
            exists: false
        action: allow
      - when:
          args.recipient:
            exists: false
          args.amount:
            eq: null
        action: allow
      - when:
          args.recipient:
            exists: false
          args.amount:
            gt: 0
        action: allow
      - when:
          args.recipient:
            eq: null
          args.amount:
            exists: false
        action: allow
      - when:
          args.recipient:
            eq: null
          args.amount:
            eq: null
        action: allow
      - when:
          args.recipient:
            eq: null
          args.amount:
            gt: 0
        action: allow
      - when:
          args.recipient:
            in:
            - CH9300762011623852957
            - GB29NWBK60161331926819
            - SE3550000000054910000003
            - US122000000121212121212
            - UK12345678901234567890
          args.amount:
            exists: false
        action: allow
      - when:
          args.recipient:
            in:
            - CH9300762011623852957
            - GB29NWBK60161331926819
            - SE3550000000054910000003
            - US122000000121212121212
            - UK12345678901234567890
          args.amount:
            eq: null
        action: allow
      - when:
          args.recipient:
            in:
            - CH9300762011623852957
            - GB29NWBK60161331926819
            - SE3550000000054910000003
            - US122000000121212121212
            - UK12345678901234567890
          args.amount:
            gt: 0
        action: allow
      - action: hold
      get_balance: allow
      get_most_recent_transactions: allow
      get_scheduled_transactions: allow
      read_file: allow
      get_user_info: allow
      update_password: allow
      update_user_info: allow
      agent__respond: allow
  capture:
    arguments: false
    redact:
    - '*token*'
    - '*secret*'
    - authorization
    maxBytesPerCall: 16384
    sample: 1.0
