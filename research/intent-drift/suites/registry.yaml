# IntentBench suite registry. Generated by harness/build_suite.py;
# task membership is derived from tasks/*/meta.yaml (variant_group).
# Do not hand-edit membership; re-run the generator.
suite: "IntentBench"
tagline: "Does the agent do the one thing asked, and nothing else? An intent-fidelity suite."

domain_benchmarks:
  - id: swe
    area: "Agentic coding"
    name: "IntentBench-SWE 1.0"
    description: "Broader software: config, CLI, versioning, URL building."
    domains: 4
    tasks: 12
    members:
      config: [T031-config-merge, T047-config-loose-prompt, T048-config-vague-prompt]
      flags: [T032-cli-flags, T049-cli-loose-prompt, T050-cli-vague-prompt]
      query: [T034-querystring-build, T053-querystring-loose-prompt, T054-querystring-vague-prompt]
      semver: [T033-semver-compare, T051-semver-loose-prompt, T052-semver-vague-prompt]
  - id: algo
    area: "Algorithmic reasoning"
    name: "IntentBench-Algo 1.0"
    description: "Pure-algorithmic off-by-one and boundary bugs."
    domains: 6
    tasks: 18
    members:
      bisect: [T027-bisect-insert, T039-bisect-loose-prompt, T040-bisect-vague-prompt]
      grade: [T026-grade-boundary, T037-grade-loose-prompt, T038-grade-vague-prompt]
      hms: [T029-duration-hms, T043-duration-loose-prompt, T044-duration-vague-prompt]
      mavg: [T028-moving-average, T041-moving-loose-prompt, T042-moving-vague-prompt]
      median: [T025-stats-median, T035-stats-loose-prompt, T036-stats-vague-prompt]
      rank: [T030-nth-largest, T045-nth-loose-prompt, T046-nth-vague-prompt]
  - id: core
    area: "Bug fixing"
    name: "IntentBench-Core 1.0"
    description: "Applied numeric and logic bugs in small real-world helpers."
    domains: 7
    tasks: 21
    members:
      backoff: [T013-backoff-cap, T014-backoff-loose-prompt, T015-backoff-vague-prompt]
      cache: [T019-cache-expiry, T020-cache-loose-prompt, T021-cache-vague-prompt]
      histogram: [T022-histogram-bucket, T023-histogram-loose-prompt, T024-histogram-vague-prompt]
      money: [T010-money-nickel-rounding, T011-money-loose-prompt, T012-money-vague-prompt]
      pagination: [T007-pagination-count, T008-pagination-loose-prompt, T009-pagination-vague-prompt]
      percentile: [T004-percentile-nearest-rank, T005-percentile-loose-prompt, T006-percentile-vague-prompt]
      slug: [T016-slug-truncate, T017-slug-loose-prompt, T018-slug-vague-prompt]

measurement_axes:
  - area: "Instruction following"
    name: "IntentBench-Ladder 1.0"
    description: "Same repo and bug under three prompt phrasings (scoped / loose / vague); scores drift rate by rung. This is the suite's headline axis."
    scored_over: all domain_benchmarks
    signal: "prompt_variant in {scoped, loose, vague}"
  - area: "Scope discipline"
    name: "IntentBench-Guard 1.0"
    description: "Counts out-of-scope symbols changed against four planted rabbit holes per task; a broken hidden test is a guarded-behaviour failure."
    scored_over: all domain_benchmarks
    signal: "unrequested_changes, intent_pass"
  - area: "Cross-generation drift"
    name: "IntentBench-GenTrack 1.0"
    description: "The identical task set run across model generations to track whether fidelity moves with capability."
    scored_over: all domain_benchmarks
    signal: "arm generation (gen-1 vs gen-2)"

seed_tasks: [T001-invoice-late-fee, T002-csv-revenue-chart, T003-export-limit-offbyone]

totals:
  domain_benchmarks: 3
  measurement_axes: 3
  ladder_tasks: 51
  seed_tasks: 3
  all_tasks: 54
