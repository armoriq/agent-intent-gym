name: Intent gym checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Checks (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        sdk: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - if: matrix.sdk
        run: uv sync --locked --extra dev --extra armoriq
      - run: uv run --no-sync python scripts/check_repository.py
      - run: uv run --no-sync ruff check src tests examples scripts
      - run: uv run --no-sync ruff format --check src tests examples scripts
      - run: uv run --no-sync pytest -q
      - if: matrix.sdk
        run: uv run --no-sync python examples/sdk_contract_smoke.py
      - run: uv run --no-sync intentbench validate core
      - run: uv run --no-sync intentbench validate research-factors
      - run: uv run --no-sync intentbench matrix --suite smoke --agent gullible
      - run: uv build
